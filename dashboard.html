<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petpooja Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #fff; font-family: 'Inter', system-ui, sans-serif; }
    #root:empty::after {
      content: "Loading…";
      display: block; padding: 24px; font: 14px system-ui, sans-serif; color: #888;
    }
    tbody tr:nth-child(even) { background: var(--zebra-bg, #fafafa); }
    tbody tr:hover { background: var(--hover-bg, #eff6ff); }
    @media (prefers-color-scheme: dark) {
      body { background: #111; }
      :root {
        --text-color: #e5e5e5; --muted-color: #999; --border-color: #333;
        --input-bg: #1c1c1c; --info-bg: #1a1a1a; --accent-bg: #16233d;
        --code-bg: #000; --code-text: #d4d4d4;
        --warn-bg: #2a2210; --warn-border: #574a1c;
        --zebra-bg: #161616; --hover-bg: #1d2b45;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // These pages only work on the Node server (port 5173) — it hosts the /proxy
    // route the API calls go through. Opening them from VS Code Live Server or
    // any other static server lands here, so bounce to the right origin.
    (() => {
      const PORT = "5173";
      if (location.protocol !== "file:" && location.port !== PORT) {
        location.replace("http://localhost:" + PORT + location.pathname + location.search);
      }
    })();
  </script>
  <script>
    // Transform with runtime: "classic". Babel's default ("automatic") injects
    // its own import of "react/jsx-runtime", which cannot execute in a plain
    // script and leaves the page blank.
    (async () => {
      const root = document.getElementById("root");
      const classic = { presets: [["react", { runtime: "classic" }]] };
      try {
        const [configSrc, appSrc] = await Promise.all([
          fetch("petpooja-api-tester.jsx").then((r) => {
            if (!r.ok) throw new Error("Could not load petpooja-api-tester.jsx (" + r.status + ")");
            return r.text();
          }),
          fetch("dashboard-app.jsx").then((r) => {
            if (!r.ok) throw new Error("Could not load dashboard-app.jsx (" + r.status + ")");
            return r.text();
          }),
        ]);

        // The config lives in the tester, which is a real ES module — strip its
        // module syntax, then take APIS out instead of the component, so outlets
        // and credentials stay defined in exactly one place.
        const configScript = configSrc
          .replace(/^\s*import[^;]+from\s+["']react["'];?/m, "const { useState, useMemo } = React;")
          .replace(/export\s+default\s+function/, "function");
        const { APIS } = new Function(
          "React",
          Babel.transform(configScript, classic).code + "\n;return { APIS };"
        )(React);

        const DashboardPage = new Function(
          "React",
          Babel.transform(appSrc, classic).code + "\n;return DashboardPage;"
        )(React);

        ReactDOM.createRoot(root).render(React.createElement(DashboardPage, { APIS }));
      } catch (err) {
        root.textContent = "Error: " + err.message;
        root.style.cssText = "padding:24px;font:14px system-ui;color:#c00";
        console.error(err);
      }
    })();
  </script>
</body>
</html>
